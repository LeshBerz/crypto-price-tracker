# Линт контракта (ADR 0008, 0014). Отступления от recommended — с обоснованием.
# Точечные исключения (health-эндпоинты без 4xx: публичные и без входных данных) — в .redocly.lint-ignore.yaml.
extends:
  - recommended
rules:
  info-license: off            # лицензия репозитория ещё не выбрана — вернуть перед публикацией
  no-server-example.com: off   # сервис запускается только локально (бриф §4)
