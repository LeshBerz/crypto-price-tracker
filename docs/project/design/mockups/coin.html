<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Карточка монеты — Crypto Price Tracker (макет)</title>
    <script>
      /* тема до первой отрисовки — без вспышки */ (function () {
        var p = 'system';
        try {
          p = localStorage.getItem('cpt-theme') || 'system';
        } catch (e) {}
        var d = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" id="favicon" href="data:," />
    <style>
      /* ===== Токены (имена как в shadcn/ui; в apps/web переедут в @theme Tailwind 4) ===== */
      :root {
        color-scheme: light;
        --background: #ffffff;
        --surface: #f6f7f9;
        --card: #ffffff;
        --foreground: #0f172a;
        --muted-foreground: #526075;
        --border: #e3e7ee;
        --input: #7b8799;
        --primary: #1d4ed8;
        --primary-foreground: #ffffff;
        --ring: #1d4ed8;
        --primary-soft: #e8efff;
        --up: #047857;
        --up-bg: #e7f6ef;
        --down: #b91c1c;
        --down-bg: #fdeceb;
        --stale: #5b6577;
        --warn-fg: #8a3c00;
        --warn-bg: #fff7e6;
        --warn-border: #f2c27a;
        --info-fg: #1e3a8a;
        --info-bg: #eef4ff;
        --info-border: #b9cdf7;
        --error-bg: #fef2f2;
        --error-border: #f3b4b4;
        --skeleton: #e9edf3;
        --shadow: 0 1px 2px rgb(15 23 42 / 0.06), 0 1px 3px rgb(15 23 42 / 0.08);
        --radius: 10px;
        --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: #0b0f17;
        --surface: #0f141e;
        --card: #111723;
        --foreground: #e6e9ef;
        --muted-foreground: #9aa4b5;
        --border: #232c3b;
        --input: #6b7689;
        --primary: #7aa7ff;
        --primary-foreground: #0b0f17;
        --ring: #7aa7ff;
        --primary-soft: #1a2a4a;
        --up: #34d399;
        --up-bg: #0d2a20;
        --down: #f87171;
        --down-bg: #301417;
        --stale: #8b95a7;
        --warn-fg: #fbbf5a;
        --warn-bg: #2a1f0b;
        --warn-border: #6b4a12;
        --info-fg: #a9c4ff;
        --info-bg: #0f1d38;
        --info-border: #24406f;
        --error-bg: #2a1214;
        --error-border: #6b2a2e;
        --skeleton: #1b2331;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
      }

      /* ===== База ===== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      .input::placeholder {
        text-transform: none;
        color: var(--muted-foreground);
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 15px/1.5 var(--font);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: var(--primary);
        text-underline-offset: 2px;
      }
      h1,
      h2,
      h3 {
        line-height: 1.25;
        margin: 0;
      }
      h1 {
        font-size: 1.375rem;
      }
      h2 {
        font-size: 1.0625rem;
      }
      h3 {
        font-size: 0.9375rem;
      }
      p {
        margin: 0;
      }
      code,
      .mono {
        font-family: var(--mono);
        font-size: 0.875em;
      }
      .num {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .skip-link {
        position: absolute;
        left: 8px;
        top: -40px;
        background: var(--card);
        padding: 8px 12px;
        border-radius: 6px;
        z-index: 50;
      }
      .skip-link:focus {
        top: 8px;
      }

      .container {
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 16px;
      }
      main {
        flex: 1;
        padding: 20px 0 32px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .spacer {
        flex: 1;
      }

      /* ===== Шапка ===== */
      .app-header {
        border-bottom: 1px solid var(--border);
        background: var(--card);
      }
      .app-header .container {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        min-height: 56px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: var(--foreground);
        text-decoration: none;
        white-space: nowrap;
      }
      .nav {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
      }
      .nav a {
        color: var(--muted-foreground);
        text-decoration: none;
        padding: 6px 10px;
        border-radius: 7px;
        font-size: 0.9rem;
      }
      .nav a:hover {
        color: var(--foreground);
        background: var(--surface);
      }
      .nav .sep {
        width: 1px;
        background: var(--border);
        margin: 6px 4px;
      }
      .header-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .rt {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8125rem;
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .rt-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--up);
      }
      .rt[data-state='offline'] .rt-dot {
        background: transparent;
        border: 2px solid var(--stale);
      }
      .user-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
      }
      @media (max-width: 720px) {
        .app-header .nav {
          order: 3;
          width: 100%;
        }
        .user-name,
        .user-btn .badge {
          display: none;
        }
      }
      @media (max-width: 420px) {
        .rt #rt-text {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
        }
        .header-tools {
          gap: 4px;
        }
        .header-tools .seg button {
          min-width: 32px;
          padding: 0 6px;
        }
      }

      /* ===== Кнопки и поля ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--surface);
      }
      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }
      .btn-primary:hover {
        background: var(--primary);
        filter: brightness(1.08);
      }
      .btn-danger {
        background: var(--down);
        border-color: var(--down);
        color: #fff;
      }
      :root[data-theme='dark'] .btn-danger {
        color: #0b0f17;
      }
      .btn-ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn-sm {
        min-height: 30px;
        padding: 0 10px;
        font-size: 0.8125rem;
      }
      .btn[disabled],
      .btn[aria-disabled='true'] {
        opacity: 0.55;
        cursor: not-allowed;
        filter: none;
      }
      .icon-btn {
        min-width: 36px;
        padding: 0 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .label {
        font-size: 0.875rem;
        font-weight: 600;
      }
      .hint {
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }
      .input {
        min-height: 38px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--input);
        background: var(--background);
        color: var(--foreground);
        font: inherit;
        width: 100%;
      }
      .input[aria-invalid='true'] {
        border-color: var(--down);
      }
      .field-error {
        color: var(--down);
        font-size: 0.8125rem;
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }

      /* Сегментированный переключатель */
      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 9px;
        background: var(--surface);
        border: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .seg button {
        min-height: 30px;
        min-width: 40px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: var(--shadow);
      }
      .seg button[aria-disabled='true'] {
        opacity: 0.45;
        cursor: not-allowed;
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }

      /* ===== Карточки, бейджи, баннеры ===== */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card-pad {
        padding: 16px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        background: var(--surface);
        white-space: nowrap;
      }
      .badge-ok {
        color: var(--up);
        background: var(--up-bg);
        border-color: transparent;
      }
      .badge-err {
        color: var(--down);
        background: var(--down-bg);
        border-color: transparent;
      }
      .badge-warn {
        color: var(--warn-fg);
        background: var(--warn-bg);
        border-color: var(--warn-border);
      }
      .badge-info {
        color: var(--info-fg);
        background: var(--info-bg);
        border-color: var(--info-border);
      }

      .banner {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 14px;
        border-radius: var(--radius);
        border: 1px solid;
      }
      .banner-warn {
        background: var(--warn-bg);
        color: var(--warn-fg);
        border-color: var(--warn-border);
      }
      .banner-info {
        background: var(--info-bg);
        color: var(--info-fg);
        border-color: var(--info-border);
      }
      .banner-error {
        background: var(--error-bg);
        color: var(--down);
        border-color: var(--error-border);
      }
      .banner .b-icon {
        font-size: 1.1rem;
        line-height: 1.3;
      }
      .banner .b-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }
      .banner strong {
        font-weight: 700;
      }
      .banner a {
        color: inherit;
        font-weight: 600;
      }

      /* ===== Числа: цена, проценты ===== */
      .price {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        font-weight: 600;
      }
      .price .lz {
        color: var(--muted-foreground);
        font-weight: 400;
      }
      .price.is-stale {
        color: var(--stale);
      }
      .chg {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        font-weight: 600;
      }
      .chg.up {
        color: var(--up);
      }
      .chg.down {
        color: var(--down);
      }
      .chg.flat,
      .chg.none {
        color: var(--muted-foreground);
      }
      .stale-tag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 0.75rem;
        color: var(--warn-fg);
        font-weight: 600;
        white-space: nowrap;
      }
      .pause-tag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 0.75rem;
        color: var(--muted-foreground);
        font-weight: 600;
        white-space: nowrap;
      }

      /* Подсветка изменившейся цены: только ячейка, ≤ 1 с, без анимации при reduced motion */
      @keyframes tick-up {
        from {
          background: var(--up-bg);
        }
        to {
          background: transparent;
        }
      }
      @keyframes tick-down {
        from {
          background: var(--down-bg);
        }
        to {
          background: transparent;
        }
      }
      .tick-up {
        animation: tick-up 1s ease-out;
      }
      .tick-down {
        animation: tick-down 1s ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .tick-up,
        .tick-down {
          animation: none;
        }
        .spinner,
        .spin {
          animation: none !important;
        }
      }

      /* ===== Таблицы ===== */
      .table-wrap {
        width: 100%;
        overflow-x: auto;
      }
      table.data {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      table.data th {
        text-align: left;
        font-weight: 600;
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      table.data td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      table.data tr:last-child td {
        border-bottom: 0;
      }
      table.data tbody tr:hover {
        background: var(--surface);
      }
      table.data .r {
        text-align: right;
      }
      .coin-cell {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .coin-sym {
        font-weight: 700;
        color: var(--foreground);
        text-decoration: none;
      }
      .coin-sym:hover {
        text-decoration: underline;
      }
      .coin-name {
        color: var(--muted-foreground);
        font-size: 0.8125rem;
      }

      /* Скелетоны */
      .sk {
        display: inline-block;
        height: 12px;
        border-radius: 6px;
        background: var(--skeleton);
      }

      /* ===== Тосты ===== */
      .toasts {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 40;
        max-width: min(380px, calc(100vw - 32px));
      }

      /* ===== Диалог ===== */
      dialog {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0;
        background: var(--card);
        color: var(--foreground);
        width: min(460px, calc(100vw - 32px));
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.3);
      }
      dialog::backdrop {
        background: rgb(2 6 23 / 0.55);
      }
      .dialog-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ===== Спиннер ===== */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spin {
        animation: spin 0.8s linear infinite;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-right-color: transparent;
        animation: spin 0.8s linear infinite;
        display: inline-block;
        vertical-align: -2px;
      }

      /* ===== Панель макета (не часть продукта) ===== */
      .mock-bar {
        border: 1px dashed var(--input);
        border-radius: var(--radius);
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        font-size: 0.8125rem;
        background: var(--surface);
      }
      .mock-bar .mb-title {
        font-weight: 700;
        color: var(--muted-foreground);
        text-transform: uppercase;
        font-size: 0.6875rem;
        letter-spacing: 0.06em;
      }
      .mock-bar label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 100%;
      }
      .mock-bar select {
        min-width: 0;
        min-height: 30px;
        border-radius: 6px;
        border: 1px solid var(--input);
        background: var(--background);
        color: var(--foreground);
        font: inherit;
        padding: 0 6px;
        max-width: 100%;
      }

      /* ===== Футер ===== */
      .app-footer {
        border-top: 1px solid var(--border);
        padding: 14px 0;
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }
      .app-footer .container {
        display: flex;
        gap: 8px 16px;
        flex-wrap: wrap;
      }

      /* =====================================================================
   Итерация 2: иконки, лого, навигация, футер, линза точности, гид
   ===================================================================== */
      .i {
        width: 1.05em;
        height: 1.05em;
        flex: none;
        vertical-align: -0.16em;
      }
      .i-sm {
        width: 0.85em;
        height: 0.85em;
      }
      .btn .i,
      .link-btn .i {
        width: 16px;
        height: 16px;
      }
      @media (max-width: 420px) {
        .hide-xs {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
        }
      }

      /* Лого: знак + словесная часть; клик — на дашборд */
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 4px 4px;
        margin-left: -4px;
        border-radius: 10px;
        color: var(--foreground);
        text-decoration: none;
      }
      .logo .logo-mark {
        flex: none;
        transition: transform 0.25s cubic-bezier(0.3, 0.7, 0.2, 1);
      }
      .logo:hover .logo-mark {
        transform: rotate(-8deg) scale(1.06);
      }
      .logo:hover .wm-1 {
        text-decoration: underline;
        text-decoration-color: var(--primary);
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }
      .logo:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .wordmark {
        display: flex;
        flex-direction: column;
        line-height: 1.05;
      }
      .wm-1 {
        font-weight: 800;
        letter-spacing: -0.01em;
        font-size: 0.95rem;
      }
      .wm-2 {
        font-size: 0.6875rem;
        color: var(--muted-foreground);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 700;
      }

      /* Навигация: общий индикатор */
      .nav {
        position: relative;
        align-items: center;
      }
      .nav a {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
      }
      .nav a[aria-current='page'] {
        color: var(--foreground);
        font-weight: 600;
      }
      .nav a[aria-disabled='true'] {
        opacity: 0.7;
      }
      .nav-ind {
        position: absolute;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        border-radius: 8px;
        transition:
          left 0.38s cubic-bezier(0.3, 0.7, 0.2, 1),
          top 0.38s cubic-bezier(0.3, 0.7, 0.2, 1),
          width 0.38s cubic-bezier(0.3, 0.7, 0.2, 1),
          height 0.38s cubic-bezier(0.3, 0.7, 0.2, 1),
          opacity 0.2s;
      }
      /* A. Маркер снизу (рекомендация) */
      html[data-nav='underline'] .nav-ind::after {
        content: '';

      /* Общие функции макетов. В apps/web: lib/format.ts, components/{logo,app-header,app-footer,price-lens,theme-toggle}.tsx */
      const CPT = (() => {
        /** «Сейчас» в макетах зафиксировано, чтобы относительное время было воспроизводимым. */
        const NOW = Date.parse('2026-10-08T11:07:30.000Z');
        const API_VERSION = '1.0.0'; // info.version из openapi.yaml
        const SWAGGER_URL = 'http://localhost:3000/docs'; // swagger-ui-express в apps/api (app.ts)
        const qp = new URLSearchParams(location.search);
        const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------- Хранилище: только удобства конкретного зрителя, всё в try/catch ---------- */
        const store = {
          get(k, d = null) {
            try {
              const v = localStorage.getItem(k);
              return v === null ? d : v;
            } catch {
              return d;
            }
          },
          set(k, v) {
            try {
              localStorage.setItem(k, v);
            } catch {
              /* приватный режим — не страшно */
            }
          },
          del(k) {
            try {
              localStorage.removeItem(k);
            } catch {
              /* */
            }
          },
        };
        const session = {
          get(k) {
            try {
              return sessionStorage.getItem(k);
            } catch {
              return null;
            }
          },
          set(k, v) {
            try {
              sessionStorage.setItem(k, v);
            } catch {
              /* */
            }
          },
        };

        /* ---------- Иконки Lucide (inline SVG) ---------- */
        function icon(name, { cls = '', label = '' } = {}) {
          const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true" focusable="false"';
          return `<svg class="i ${cls}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${LUCIDE[name]}</svg>`;
        }

        /* ---------- Тема: светлая / тёмная / как в системе ---------- */
        const mq = matchMedia('(prefers-color-scheme: dark)');
        const readPref = () => store.get('cpt-theme', 'system');
        const THEMES = { light: ['sun', 'светлая'], dark: ['moon', 'тёмная'], system: ['monitor', 'как в системе'] };
        const ORDER = ['light', 'dark', 'system'];
        function applyTheme(pref) {
          const theme = pref === 'system' ? (mq.matches ? 'dark' : 'light') : pref;
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('[data-theme-cycle]').forEach((b) => {
            const [ic, name] = THEMES[pref];
            b.innerHTML = icon(ic);
            b.setAttribute('aria-label', `Тема: ${name}. Нажмите, чтобы сменить`);
            b.title = `Тема: ${name} (T)`;
          });
          document.dispatchEvent(new CustomEvent('cpt:theme', { detail: theme }));
        }
        mq.addEventListener('change', () => {
          if (readPref() === 'system') applyTheme('system');
        });
        /** Одна кнопка-цикл «светлая → тёмная → как в системе»: компактно для шапки, состояние — в aria-label. */
        function themeToggleHTML() {
          return `<button type="button" class="btn btn-ghost btn-sm icon-btn" data-theme-cycle aria-keyshortcuts="t"></button>`;
        }
        function setTheme(pref) {
          store.set('cpt-theme', pref);
          applyTheme(pref);
        }
        function cycleTheme() {
          setTheme(ORDER[(ORDER.indexOf(readPref()) + 1) % 3]);
        }
        function bindThemeToggle(root = document) {
          root.querySelectorAll('[data-theme-cycle]').forEach((b) => b.addEventListener('click', cycleTheme));
          applyTheme(readPref());
        }

        /* ---------- Цены: строка → Intl.NumberFormat без Number() (ADR 0006, 0012) ---------- */
        const usd2 = new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        const usdSig = new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          maximumSignificantDigits: 6,
        });
        /** Decimal из контракта: ^(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$ — значит, «< 1» ⇔ строка начинается с «0». */
        const belowOne = (s) => s.startsWith('0');
        function formatPrice(s) {
          return belowOne(s) ? usdSig.format(s) : usd2.format(s);
        }
        function priceBody(s) {
          const f = formatPrice(s);
          const m = f.match(/^\$0\.(0{3,})(\d+)$/);
          return m ? `$0.<span class="lz">${m[1]}</span>${m[2]}` : f;
        }
        /**
         * Цена. По умолчанию — кнопка «линзы точности» (фирменная деталь): по нажатию показывает строку из API целиком.
         * meta: { sym, src (sourceUpdatedAt), fetched (fetchedAt) } — для подписи в линзе.
         */
        function priceHTML(s, { stale = false, cls = '', lens = true, sym = '', src = '', fetched = '' } = {}) {
          const body = priceBody(s);
          if (!lens) return `<span class="price ${stale ? 'is-stale' : ''} ${cls}">${body}</span>`;
          return `<button type="button" class="price price-lens ${stale ? 'is-stale' : ''} ${cls}" data-price="${s}" data-sym="${sym}" data-src="${src}" data-fetched="${fetched}"
      aria-haspopup="dialog" aria-label="${formatPrice(s)}${stale ? ', устарела' : ''}. Показать точное значение">${body}</button>`;
        }
        /** Подпись шкалы графика: значащие цифры, а не фиксированные знаки (ADR 0012). */
        const axisSig = new Intl.NumberFormat('en-US', { maximumSignificantDigits: 5 });
        const axis2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        function axisLabel(n) {
          return n < 1 ? axisSig.format(n) : axis2.format(n);
        }

        /* ---------- Проценты: знак всегда, стрелка-иконка, цвет ---------- */
        const pct = new Intl.NumberFormat('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
          signDisplay: 'exceptZero',
        });
        function changeHTML(s, { suffix = '' } = {}) {
          if (s == null)

          const t = pct.format(s).replace('-', '−');
          const dir = t.startsWith('+') ? 'up' : t.startsWith('−') ? 'down' : 'flat';
          const ic = dir === 'up' ? icon('arrow-up') : dir === 'down' ? icon('arrow-down') : icon('minus');
          return `<span class="chg ${dir}" title="${s} %">${ic}${t}%${suffix}</span>`;
        }

        /* ---------- Время: пояс браузера, в подсказке — ISO UTC ---------- */
        const hm = new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const hms = new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dt = new Intl.DateTimeFormat('ru-RU', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
        });
        const dts = new Intl.DateTimeFormat('ru-RU', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
        const fmt = {
          hm: (i) => hm.format(Date.parse(i)),
          hms: (i) => hms.format(Date.parse(i)),
          dt: (i) => dt.format(Date.parse(i)),
          dts: (i) => dts.format(Date.parse(i)),
        };
        function relative(iso) {
          const s = Math.max(0, (NOW - Date.parse(iso)) / 1000);
          if (s < 60) return 'только что';
          const m = Math.floor(s / 60);
          if (m < 60) return `${m} мин назад`;
          const h = Math.floor(m / 60);
          if (h < 24) return `${h} ч назад`;
          return `${Math.floor(h / 24)} дн назад`;
        }
        function timeHTML(iso, mode = 'rel') {
          const text = mode === 'rel' ? relative(iso) : fmt[mode](iso);
          return `<time datetime="${iso}" title="${iso} (UTC)">${text}</time>`;
        }
        const iso = (ms) => new Date(ms).toISOString();

        /* ---------- Мини-график: свой SVG (ADR 0012) ---------- */
        function sparkHTML(points, { w = 104, h = 30, label = '' } = {}) {
          if (!points || points.length < 2) return `<span class="muted" title="Данных пока нет">—</span>`;
          const v = points.map((p) => Number(p.close)); // Number() допустим только для отрисовки
          const min = Math.min(...v),
            max = Math.max(...v),
            span = max - min || 1;
          const d = v
            .map(
              (y, i) =>
                `${i ? 'L' : 'M'}${((i / (v.length - 1)) * (w - 2) + 1).toFixed(1)},${(h - 3 - ((y - min) / span) * (h - 6)).toFixed(1)}`,
            )
            .join('');
          // Почти без изменений (< 0,1 %) — нейтральный цвет: не красим «шум» стейблкоина
          const rel = Math.abs(v[v.length - 1] - v[0]) / v[0];
          const dir = rel < 0.001 ? 'muted-foreground' : v[v.length - 1] >= v[0] ? 'up' : 'down';
          return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}"><path d="${d}" fill="none" stroke="var(--${dir})" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
        }

        /** Монета без логотипа: логотипов нет в контракте (CMC отдаёт их только через /info — открытый вопрос). Тон — от cmcId. */
        function coinIcon(c, size = 28) {
          const hue = (c.cmcId * 47) % 360;
          return `<span class="coin-ico" style="--hue:${hue};width:${size}px;height:${size}px" aria-hidden="true">${icon('coins')}</span>`;
        }

        /* ---------- Детерминированные моки ---------- */
        function rng(seed) {
          return () => {
            seed |= 0;
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        /** Число → Decimal-строка контракта (без экспоненты и хвостовых нулей). Только для генерации моков. */
        function toDecimal(n, sig = 10) {
          let s = n.toPrecision(sig);
          if (/e/i.test(s)) s = n.toFixed(20);
          if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
          return s;
        }

        /* ---------- Логотип: 3 варианта знака ---------- */
        const LOGOS = {
          // A. «Точка» (рекомендация): линия цены заканчивается жирной точкой — точное последнее значение
          dot: {
            name: 'A · «Точка»',
            mark: `<path d="M5 16.5 9 12l3.2 2.6L16 9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18.6" cy="7.6" r="2.7" fill="currentColor"/>`,
          },
          // B. «Пульс»: незамкнутое кольцо отсчёта до синхронизации и точка в центре
          pulse: {
            name: 'B · «Пульс»',
            mark: `<path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/><circle cx="19.5" cy="5.6" r="1.6" fill="currentColor"/>`,

        /** Индикатор активного пункта: «перетекает» от прошлого пункта (sessionStorage) и за курсором/фокусом. */
        function placeIndicator(nav, target, animate = true) {
          const ind = nav.querySelector('.nav-ind');
          if (!ind || !target) {
            if (ind) ind.style.opacity = '0';
            return;
          }
          const nr = nav.getBoundingClientRect(),
            r = target.getBoundingClientRect();
          if (!animate) ind.style.transition = 'none';
          Object.assign(ind.style, {
            opacity: '1',
            left: `${r.left - nr.left}px`,
            top: `${r.top - nr.top}px`,
            width: `${r.width}px`,
            height: `${r.height}px`,
          });
          if (!animate) {
            void ind.offsetWidth;
            ind.style.transition = '';
          }
        }
        function bindNav() {
          const nav = document.querySelector('.app-header .nav');
          if (!nav) return;
          document.documentElement.dataset.nav = navVariant();
          const active = nav.querySelector('[aria-current="page"]');
          const from = session.get('cpt-nav-from');
          const prev = from && nav.querySelector(`[data-nav="${from}"]`);
          placeIndicator(nav, prev || active, false);
          requestAnimationFrame(() => placeIndicator(nav, active));
          nav.querySelectorAll('a').forEach((a) => {
            a.addEventListener('mouseenter', () => placeIndicator(nav, a));
            a.addEventListener('focus', () => placeIndicator(nav, a));
            a.addEventListener('click', () => session.set('cpt-nav-from', active?.dataset.nav ?? ''));
          });
          nav.addEventListener('mouseleave', () => placeIndicator(nav, active));
          nav.addEventListener('focusout', (e) => {

        /* ---------- Футер: версия контракта, статус системы, источник данных, Swagger, клавиши, гид ---------- */

        function setFooterStatus(kind, text, { role = 'operator' } = {}) {

        function setRealtime(state) {

        /* ---------- Тосты: aria-live="polite" (WCAG 4.1.3) ---------- */
        function toast(html, kind = 'info') {
          let box = document.getElementById('toasts');

        /** Перезапуск CSS-анимации подсветки цены. */
        function flash(el, dir) {
          el.classList.remove('tick-up', 'tick-down');
          void el.offsetWidth;
          el.classList.add(dir === 'up' ? 'tick-up' : 'tick-down');
        }
        const esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
          );

        /* ---------- «Линза точности» — фирменная деталь ---------- */
        function groupDigits(s) {
          const [int, frac = ''] = s.split('.');
          const gi = int.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
          const gf = frac.replace(/(\d{3})(?=\d)/g, '$1 ');
          return { int: gi, frac: gf };
        }
        /** Сколько значащих цифр в строке и сколько из них видно в таблице. */
        function digitsInfo(s) {
          const sig = s.replace('.', '').replace(/^0+/, '').length;
          const shown = belowOne(s) ? Math.min(6, sig) : Math.min(sig, s.split('.')[0].length + 2);
          return { sig, shown };
        }
        let lensReturn = null;
        function openLens(btn) {
          closeLens();
          const s = btn.dataset.price,
            sym = btn.dataset.sym,
            { int, frac } = groupDigits(s),
            { sig, shown } = digitsInfo(s);
          const shownStr = formatPrice(s);
          // Раскладываем все цифры дробной части: видимые в таблице — обычные, «спрятанные» округлением — подсвечены
          const fracDigits = [...frac];
          let seenSig = s.split('.')[0].replace(/^0+/, '').length,
            html = '';
          let delay = 0;
          for (const ch of fracDigits) {
            if (ch === ' ') {
              html += '<span class="g"> </span>';
              continue;
            }
            const significant = seenSig > 0 || ch !== '0';
            if (significant) seenSig++;
            const hidden = belowOne(s) ? seenSig > 6 : html.replace(/<[^>]+>/g, '').replace(/ /g, '').length >= 2;
            html += `<span class="d ${hidden ? 'hid' : ''} ${!significant ? 'lzd' : ''}" style="--d:${delay}ms">${ch}</span>`;
            if (hidden) delay += 35;
          }
          const pop = document.createElement('div');
          pop.className = 'lens';
          pop.id = 'lens';
          pop.setAttribute('role', 'dialog');
          pop.setAttribute('aria-modal', 'false');
          pop.setAttribute('aria-labelledby', 'lens-title');
          pop.innerHTML = `<div class="lens-head"><span id="lens-title" class="lens-title">${icon('crosshair')}Точная цена${sym ? ` ${sym}` : ''}</span>
        <button type="button" class="icon-btn btn btn-ghost btn-sm" data-lens-close aria-label="Закрыть">${icon('x')}</button></div>
      <div class="lens-digits" aria-label="${s} долларов США"><span aria-hidden="true">$${int}${frac ? `<span class="pt">.</span>${html}` : ''}</span></div>
      <dl class="dl lens-dl">
        <dt>В интерфейсе</dt><dd class="num">${shownStr}</dd>
        <dt>Значащих цифр</dt><dd>${sig} — показано ${shown}${sig > shown ? `, ещё <strong>${sig - shown}</strong> скрыто округлением` : ''}</dd>
        ${btn.dataset.src ? `<dt>Котировка CMC</dt><dd>${timeHTML(btn.dataset.src, 'hms')} <span class="muted">sourceUpdatedAt</span></dd>` : ''}
        ${btn.dataset.fetched ? `<dt>Получено сервисом</dt><dd>${timeHTML(btn.dataset.fetched, 'hms')} <span class="muted">fetchedAt</span></dd>` : ''}
      </dl>
      <p class="hint">Строка из API без преобразования в число: ни одна цифра CoinMarketCap не потеряна (ADR 0006).</p>
      <div class="row"><button type="button" class="btn btn-sm" data-lens-copy>${icon('copy')}Скопировать точное значение</button></div>`;
          document.body.append(pop);
          const r = btn.getBoundingClientRect(),
            W = document.documentElement.clientWidth;
          const pw = Math.min(360, W - 24);
          pop.style.width = `${pw}px`;
          let left = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), W - pw - 12);
          let top = r.bottom + 8 + scrollY;
          pop.style.left = `${left + scrollX}px`;
          pop.style.top = `${top}px`;
          const ph = pop.getBoundingClientRect().height;
          if (r.bottom + 8 + ph > innerHeight && r.top - 8 - ph > 0) pop.style.top = `${r.top - 8 - ph + scrollY}px`;
          requestAnimationFrame(() => pop.classList.add('open'));
          btn.setAttribute('aria-expanded', 'true');
          lensReturn = btn;
          pop.querySelector('[data-lens-close]').addEventListener('click', () => closeLens(true));
          pop.querySelector('[data-lens-copy]').addEventListener('click', () => {
            navigator.clipboard?.writeText(s).catch(() => {});
            toast(`Скопировано: <code>${s}</code>`, 'ok');
          });
          pop.querySelector('[data-lens-copy]').focus();
        }
        function closeLens(refocus = false) {
          const p = document.getElementById('lens');
          if (!p) return;
          p.remove();
          if (lensReturn) {
            lensReturn.setAttribute('aria-expanded', 'false');
            if (refocus) lensReturn.focus();
          }
        }

        /* ---------- Горячие клавиши (WCAG 2.1.4: можно отключить) ---------- */
        const hotkeysOn = () => store.get('cpt-hotkeys', 'on') === 'on';
        function openHotkeys() {
          let d = document.getElementById('hotkeys-dlg');
          if (!d) {
            d = document.createElement('dialog');
            d.id = 'hotkeys-dlg';
            d.setAttribute('aria-labelledby', 'hk-title');
            d.innerHTML = `<div class="dialog-body"><h2 id="hk-title" class="row">${icon('keyboard')}Горячие клавиши</h2>
        <table class="data hk"><tbody>
          <tr><td><kbd>?</kbd></td><td>Эта справка</td></tr>
          <tr><td><kbd>G</kbd></td><td>Гид по текущему экрану</td></tr>
          <tr><td><kbd>T</kbd></td><td>Сменить тему</td></tr>
          <tr><td><kbd>1</kbd>…<kbd>4</kbd></td><td>Дашборд, Watchlist, Синхронизация, Система (Operator)</td></tr>
          <tr><td><kbd>Esc</kbd></td><td>Закрыть окно, линзу или гид</td></tr>
          <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Шаги гида; бакеты на графике (в фокусе)</td></tr>
        </tbody></table>
        <label class="row"><input type="checkbox" id="hk-on"> Однобуквенные клавиши включены</label>
        <p class="hint">Отключите, если они мешают скринридеру или голосовому вводу (WCAG 2.1.4).</p>
        <div class="dialog-actions"><button class="btn" data-close>Закрыть</button></div></div>`;
            document.body.append(d);
            d.querySelector('[data-close]').addEventListener('click', () => d.close());
            d.querySelector('#hk-on').addEventListener('change', (e) =>
              store.set('cpt-hotkeys', e.target.checked ? 'on' : 'off'),
            );
          }
          d.querySelector('#hk-on').checked = hotkeysOn();
          d.showModal();
        }
        function bindHotkeys() {
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLens(true);
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const t = e.target;
            if (
              t.closest?.('input, textarea, select, [contenteditable], dialog[open]') ||
              document.querySelector('.tour-card')
            )
              return;
            if (e.key === '?') {
              e.preventDefault();
              openHotkeys();
              return;
            }
            if (!hotkeysOn()) return;
            const k = e.key.toLowerCase();
            if (k === 'g' || k === 'п') {
              e.preventDefault();
              window.CPT_TOUR?.start({ manual: true });
            }
            if (k === 't' || k === 'е') {
              cycleTheme();
              toast(`Тема: ${THEMES[readPref()][1]}`, 'info');
            }
            const go = {
              1: 'dashboard.html',
              2: 'operator.html#watchlist',
              3: 'operator.html#sync',
              4: 'operator.html#system',
            }[e.key];
            if (go && (e.key === '1' || document.querySelector('[data-nav="watchlist"]'))) location.href = go;
          });
          document.addEventListener('click', (e) => {
            const lens = e.target.closest('.price-lens');
            if (lens) {
              e.preventDefault();
              if (lensReturn === lens && document.getElementById('lens')) closeLens(true);
              else openLens(lens);
              return;
            }
            if (!e.target.closest('#lens')) closeLens();
            if (e.target.closest('[data-hotkeys]')) openHotkeys();
            if (e.target.closest('[data-tour-start]')) window.CPT_TOUR?.start({ manual: true });
            if (e.target.closest('[data-tour-restart]')) {
              window.CPT_TOUR?.reset();
              window.CPT_TOUR?.start({ manual: true });
            }
          });
        }

        /* ---------- Панель макета: общие переключатели ---------- */
        function mountMockControls() {
          const bar = document.querySelector('.mock-bar');
          if (!bar || bar.querySelector('[data-mock-common]')) return;

      <button type="button" class="btn btn-sm" id="mock-reset" title="Гид снова запустится при первом входе">Сбросить «пройдено»</button>`;
          bar.append(wrap);

            nv = wrap.querySelector('#mock-nav');

          nv.value = navVariant();

        /** Шапка + футер + общие обработчики. Повторный вызов (смена роли) перерисовывает только шапку. */
        let inited = false;
        function mountChrome({ active = 'dashboard', role = 'operator', rt = 'online', header = true } = {}) {
          if (header) {
            document.getElementById('header').innerHTML = headerHTML({ active, role, rt });
            bindThemeToggle(document.getElementById('header'));

          if (!inited) {
            inited = true;
            const f = document.getElementById('footer');
            if (f) f.innerHTML = footerHTML();
