        return {
          NOW,
          qp,
          reduced,
          store,
          iso,
          icon,
          applyTheme,
          bindThemeToggle,
          themeToggleHTML,
          formatPrice,
          priceHTML,
          axisLabel,
          changeHTML,
          fmt,
          relative,
          timeHTML,
          sparkHTML,
          coinIcon,
          rng,
          toDecimal,
          logoMarkSVG,
          logoHTML,
          LOGOS,
          mountChrome,
          setFooterStatus,
          setRealtime,
          toast,
          flash,
          esc,
          openLens,
          closeLens,
          openHotkeys,
        };
      })();

      /* Гид-тренер: прожектор + карточка. Чистый JS без библиотек (в apps/web — см. ADR 0018).
   Доступность: role="dialog" + aria-modal, ловушка фокуса, ←/→/Esc, aria-live, prefers-reduced-motion. */
      window.CPT_TOUR = (() => {
        const SEQ = ['login.html', 'dashboard.html', 'coin.html', 'operator.html']; // порядок режима презентации
        let pageKey = '',
          role = 'operator',
          getSteps = () => [],
          list = [],
          i = 0,
          root = null,
          presenting = false,
          paused = false,
          timer = null,
          returnFocus = null,
          busy = false,
          pending = 0;
        const fast = CPT.qp.get('speed') === 'fast';
        const wait = (ms) => new Promise((r) => setTimeout(r, CPT.reduced() ? 0 : ms));
        const doneKey = () => `cpt-tour-${pageKey}-${role}`;

        function register(key, fn) {
          pageKey = key;
          getSteps = fn;
        }
        function setRole(r) {
          role = r;
        }
        function reset() {
          ['login', 'dashboard', 'coin', 'operator'].forEach((p) =>
            ['viewer', 'operator'].forEach((r) => CPT.store.del(`cpt-tour-${p}-${r}`)),
          );
        }
        function autoStart() {
          if (CPT.qp.get('present') === '1') {
            setTimeout(() => start({ present: true }), 500);
            return;
          }
          if (CPT.qp.get('tour') === '0' || CPT.store.get(doneKey())) return;
          setTimeout(() => {
            if (!root) start({});
          }, 800);
        }
        function present() {
          // Презентация всегда начинается с первого экрана и идёт под ролью Operator (там больше всего шагов)
          const first = SEQ[0];
          if (location.pathname.endsWith(first)) start({ present: true });
          else location.href = `${first}?present=1${fast ? '&speed=fast' : ''}`;
        }

        /** Первый видимый элемент по селектору (на телефоне таблица скрыта — берём карточку). */
        function visible(sel) {
          if (!sel) return null;
          return (
            [...document.querySelectorAll(sel)].find(
              (e) => e.getClientRects().length && getComputedStyle(e).visibility !== 'hidden',
            ) ?? null
          );
        }

        function build() {
          root = document.createElement('div');
          root.className = 'tour-root';
          root.innerHTML = `<div class="tour-veil"></div><div class="tour-spot" aria-hidden="true"></div>
      <div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-body">
        <div class="tour-top"><span class="tour-step" id="tour-step"></span><span class="spacer"></span>
          <button type="button" class="btn btn-ghost btn-sm icon-btn" data-t="skip" aria-label="Закрыть гид">${CPT.icon('x')}</button></div>
        <div class="tour-progress" aria-hidden="true"><span></span></div>
        <h2 class="tour-title" id="tour-title"></h2>
        <div class="tour-body" id="tour-body"></div>
        <div class="tour-actions"></div>
      </div>
      <div class="sr-only" aria-live="polite" id="tour-live"></div>`;
          document.body.append(root);
          root.addEventListener('click', (e) => {
            const b = e.target.closest('[data-t]');
            if (!b) return;
            const a = b.dataset.t;
            if (a === 'next') next();
            else if (a === 'prev') prev();
            else if (a === 'skip') finish(false);
            else if (a === 'pause') {
              paused = !paused;
              renderActions();
              if (!paused) schedule();
              else clearTimeout(timer);
            } else if (a === 'stop') {
              presenting = false;
              finish(false);
            }
          });
          document.addEventListener('keydown', onKey, true);
          addEventListener('resize', reposition);
          addEventListener('scroll', reposition, { passive: true });
        }

        function onKey(e) {
          if (!root) return;
          if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            presenting = false;
            finish(false);
            return;
          }
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            next();
            return;
          }
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prev();
            return;
          }
          if (e.key === 'Tab') {
            // ловушка фокуса внутри карточки
            const f = [...root.querySelectorAll('.tour-card button')].filter((b) => !b.disabled);
            if (!f.length) return;
            const first = f[0],
              last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            } else if (!root.contains(document.activeElement)) {
              e.preventDefault();
              first.focus();
            }
          }
        }

        async function start({ present: pres = false, manual = false } = {}) {
          if (root || busy) return;
          list = getSteps(role).filter((s) => !s.roles || s.roles.includes(role));
          pending = 0;
          if (!list.length) return;
          presenting = pres;
          paused = false;
          i = 0;
          returnFocus = document.activeElement;
          CPT.closeLens?.();
          document.querySelectorAll('dialog[open]').forEach((d) => d.close());
          build();
          await show(0, true);
        }

        async function show(n, first = false) {
          if (busy) return;
          busy = true;
          clearTimeout(timer);
          i = Math.max(0, Math.min(n, list.length - 1));
          const step = list[i];
          const card = root.querySelector('.tour-card'),
            spot = root.querySelector('.tour-spot');
          if (!first) {
            card.classList.add('leaving');
            await wait(160);
          }
          if (step.before) {
            await step.before();
            await wait(120);
          }
          const target = visible(step.el);
          if (target) {
            target.scrollIntoView({ block: 'center', behavior: CPT.reduced() ? 'auto' : 'smooth' });
            await wait(first ? 120 : 380);
          }
          card.querySelector('#tour-step').textContent = `Шаг ${i + 1} из ${list.length}`;
          card.querySelector('.tour-progress span').style.width = `${((i + 1) / list.length) * 100}%`;
          card.querySelector('#tour-title').innerHTML = `${CPT.icon(step.icon || 'compass')}${step.title}`;
          card.querySelector('#tour-body').innerHTML =
            `${step.body}${step.api ? `<p class="tour-api">${CPT.icon('database')}<span>Данные: ${step.api}</span></p>` : ''}${step.todo ? `<p class="tour-todo">${CPT.icon('lightbulb')}<span>${step.todo}</span></p>` : ''}`;
          renderActions();
          root.dataset.hasTarget = target ? '1' : '0';
          reposition();
          if (first) {
            spot.classList.add('appear');
          }
          card.classList.remove('leaving');
          root.querySelector('#tour-live').textContent = `Шаг ${i + 1} из ${list.length}. ${step.title}`;
          (root.querySelector('[data-t="next"]') || root.querySelector('[data-t="stop"]'))?.focus({
            preventScroll: true,
          });
          busy = false;
          // Нажатия во время анимации не теряются: копим и проигрываем по одному
          if (pending) {
            const d = Math.sign(pending);
            pending -= d;
            if (d > 0) next();
            else prev();
            return;
          }
          if (presenting) schedule();
        }

        function renderActions() {
          const a = root.querySelector('.tour-actions');
          const last = i === list.length - 1;
          const nextLabel = last ? (presenting && nextPage() ? 'Следующий экран' : 'Готово') : 'Далее';
          a.innerHTML = `${
            presenting
              ? `<button type="button" class="btn btn-ghost btn-sm" data-t="stop">${CPT.icon('square')}Стоп</button>
         <button type="button" class="btn btn-sm" data-t="pause" aria-pressed="${paused}">${paused ? `${CPT.icon('play')}Продолжить` : `${CPT.icon('pause')}Пауза`}</button>`
              : `<button type="button" class="btn btn-ghost btn-sm" data-t="skip">Пропустить</button>`
          }
      <span class="spacer"></span>
      <button type="button" class="btn btn-sm" data-t="prev" ${i === 0 ? 'disabled' : ''} aria-keyshortcuts="ArrowLeft">${CPT.icon('chevron-left')}Назад</button>
      <button type="button" class="btn btn-primary btn-sm" data-t="next" aria-keyshortcuts="ArrowRight">${nextLabel}${last ? '' : CPT.icon('chevron-right')}</button>`;
          root.querySelector('.tour-card').classList.toggle('presenting', presenting);
          const bar = root.querySelector('.tour-auto');
          if (bar) bar.remove();
          if (presenting) {
            const auto = document.createElement('div');
            auto.className = 'tour-auto';
            auto.setAttribute('aria-hidden', 'true');
            auto.innerHTML = '<span></span>';
            root.querySelector('.tour-card').append(auto);
          }
        }

        /** Автопроигрывание: длительность шага зависит от объёма текста. */
        function schedule() {
          clearTimeout(timer);
          if (!presenting || paused) return;
          const text = root.querySelector('#tour-body').textContent.length;
          const ms = fast ? 500 : Math.min(9000, 3200 + text * 28);
          const bar = root.querySelector('.tour-auto span');
          if (bar) {
            bar.style.transition = 'none';
            bar.style.width = '0%';
            void bar.offsetWidth;
            bar.style.transition = `width ${ms}ms linear`;
            bar.style.width = '100%';
          }
          timer = setTimeout(() => next(), ms);
        }

        function reposition() {
          if (!root) return;
          const step = list[i],
            target = visible(step?.el);
          const spot = root.querySelector('.tour-spot'),
            card = root.querySelector('.tour-card');
          const W = document.documentElement.clientWidth,
            H = innerHeight,
            pad = 6;
          const mobile = W < 640;
          card.classList.toggle('docked', mobile);
          if (target) {
            const r = target.getBoundingClientRect();
            Object.assign(spot.style, {
              left: `${r.left - pad}px`,
              top: `${r.top - pad}px`,
              width: `${r.width + pad * 2}px`,
              height: `${r.height + pad * 2}px`,
              opacity: '1',
            });
            if (mobile) return;
            const cw = Math.min(380, W - 24),
              ch = card.offsetHeight;
            card.style.width = `${cw}px`;
            let top = r.bottom + pad + 12;
            if (top + ch > H - 12) top = r.top - pad - 12 - ch;
            if (top < 12) top = Math.max(12, Math.min(H - ch - 12, r.top)); // не влезает ни сверху, ни снизу — рядом
            let left = Math.min(Math.max(12, r.left), W - cw - 12);
            if (top < r.bottom && top + ch > r.top && r.right + cw + 24 < W) left = r.right + 18; // сбоку, если перекрывает
            card.style.left = `${left}px`;
            card.style.top = `${top}px`;
          } else {
            Object.assign(spot.style, {
              left: `${W / 2}px`,
              top: `${H / 2}px`,
              width: '0px',
              height: '0px',
              opacity: '1',
            });
            if (mobile) return;
            const cw = Math.min(420, W - 24);
            card.style.width = `${cw}px`;
            card.style.left = `${(W - cw) / 2}px`;
            card.style.top = `${Math.max(12, (H - card.offsetHeight) / 2)}px`;
          }
        }

        const nextPage = () => {
          const cur = SEQ.findIndex((p) => location.pathname.endsWith(p));
          return cur >= 0 && cur < SEQ.length - 1 ? SEQ[cur + 1] : null;
        };
        function next() {
          if (busy) {
            pending += 1;
            return;
          }
          if (i < list.length - 1) show(i + 1);
          else finish(true);
        }
        function prev() {
          if (busy) {
            pending -= 1;
            return;
          }
          if (i > 0) show(i - 1);
        }

        function finish(completed) {
          clearTimeout(timer);
          if (!root) return;
          CPT.store.set(doneKey(), completed ? 'done' : 'skipped');
          document.removeEventListener('keydown', onKey, true);
          removeEventListener('resize', reposition);
          removeEventListener('scroll', reposition);
          list.forEach((s) => s.after?.());
          root.remove();
          root = null;
          if (presenting && completed) {
            const np = nextPage();
            if (np) {
              location.href = `${np}?present=1${fast ? '&speed=fast' : ''}`;
              return;
            }
            CPT.toast('Демо завершено. Спасибо! Гид можно пройти заново из футера.', 'ok');
            document.documentElement.dataset.presentDone = '1';
          } else if (!completed) CPT.toast('Гид можно открыть кнопкой «Гид» в шапке или клавишей G', 'info');
          presenting = false;
          returnFocus?.focus?.({ preventScroll: true });
        }

        return {
          register,
          setRole,
          autoStart,
          start,
          present,
          reset,
          get active() {
            return !!root;
          },
          get index() {
            return i;
          },
          get total() {
            return list.length;
          },
        };
      })();
    </script>
    <script>
      const MIN = 60_000,
        HOUR = 60 * MIN,
        DAY = 24 * HOUR,
        NOW = CPT.NOW;
      const COINS = {
        1: {
          id: 1,
          cmcId: 1,
          symbol: 'BTC',
          name: 'Bitcoin',
          color: '#c2410c',
          price: '67123.451234567891',
          chg: '1.2345',
          createdAt: '2025-09-14T08:00:00.000Z',
          vol: 0.006,
        },
        7: {
          id: 7,
          cmcId: 24478,
          symbol: 'PEPE',
          name: 'Pepe',
          color: '#15803d',
          price: '0.0000123456789',
          chg: '5.6789',
          createdAt: '2025-11-02T10:00:00.000Z',
          vol: 0.014,
        },
      };
      const INTERVALS = { '1h': HOUR, '4h': 4 * HOUR, '1d': DAY, '1w': 7 * DAY };
      const PERIODS = { '24h': DAY, '7d': 7 * DAY, '30d': 30 * DAY, '1y': 365 * DAY };
      const LABEL_I = { '1h': '1 ч', '4h': '4 ч', '1d': '1 д', '1w': '1 нед' };
      const LABEL_P = { '24h': '24 ч', '7d': '7 д', '30d': '30 д', '1y': '1 год' };

      const params = new URLSearchParams(location.search);
      const state = {
        id: params.get('id') === '7' ? 7 : 1,
        scen: params.get('scenario') || 'normal',
        kind: 'candles',
        interval: params.get('interval') || '1h',
        period: params.get('period') || '7d',
        sel: null,
        histShown: 10,
      };

      /** Почасовые OHLC-свёртки (как price_rollups_1h, ADR 0007). Детерминированно, последняя цена = текущая. */
      function hourly(coin, scen) {
        const r = CPT.rng(coin.id * 31),
          n = 24 * 365,
          end = Number(coin.price),
          out = [];
        const hoursOfData = scen === 'few' ? 6 : n;
        let v = end / (1 + (Number(coin.chg) / 100) * 8);
        const topHour = Math.floor(NOW / HOUR) * HOUR;
        for (let i = 0; i < n; i++) {
          const t = topHour - (n - 1 - i) * HOUR;
          const pull = (end - v) / (n - i); // мягко тянем к текущей цене
          const o = v;
          v = Math.max(v * (1 + (r() - 0.5) * coin.vol) + pull, end * 0.2);
          if (i === n - 1) v = end;
          const hi = Math.max(o, v) * (1 + r() * coin.vol * 0.4),
            lo = Math.min(o, v) * (1 - r() * coin.vol * 0.4);
          if (n - i > hoursOfData) continue;
          // Пропуск: CMC лежал 30–35 ч назад — бакетов нет, их не выдумываем
          if (scen !== 'few' && n - i > 30 && n - i <= 35) continue;
          out.push({ t, o, h: hi, l: lo, c: v, points: i === n - 1 ? 3 : 12 });
        }
        return out;
      }

      /** getPriceAggregates: группировка часовых свёрток в интервал. Наружу — строки (Decimal). */
      function aggregates(hours, interval, period) {
        const size = INTERVALS[interval],
          from = NOW - PERIODS[period];
        const MONDAY = Date.parse('2026-10-05T00:00:00.000Z'); // недели — с понедельника (ADR 0007)
        const key = (t) =>
          interval === '1w' ? MONDAY + Math.floor((t - MONDAY) / size) * size : Math.floor(t / size) * size;
        const map = new Map();
        for (const h of hours) {
          if (h.t + HOUR <= from) continue;
          const k = key(h.t);
          const b = map.get(k);
          if (!b) map.set(k, { t: k, o: h.o, h: h.h, l: h.l, c: h.c, points: h.points, sum: h.c * h.points });
          else {
            b.h = Math.max(b.h, h.h);
            b.l = Math.min(b.l, h.l);
            b.c = h.c;
            b.points += h.points;
            b.sum += h.c * h.points;
          }
        }
        const D = (x) => CPT.toDecimal(x, 10);
        const buckets = [...map.values()].map((b) => ({
          bucketStart: CPT.iso(b.t),
          stats: {
            open: D(b.o),
            close: D(b.c),
            min: D(b.l),
            max: D(b.h),
            avg: D(b.sum / b.points),
            changePercent: (((b.c - b.o) / b.o) * 100)
              .toFixed(4)
              .replace(/\.?0+$/, '')
              .replace(/^-0$/, '0'),
            points: b.points,
          },
        }));
        if (!buckets.length) return { interval, from: CPT.iso(from), to: CPT.iso(NOW), summary: null, buckets };
        const all = [...map.values()];
        const o = all[0].o,
          c = all.at(-1).c,
          pts = all.reduce((s, b) => s + b.points, 0);
        return {
          cryptocurrencyId: state.id,
          currency: 'USD',
          interval,
          from: CPT.iso(from),
          to: CPT.iso(NOW),
          buckets,
          summary: {
            open: D(o),
            close: D(c),
            min: D(Math.min(...all.map((b) => b.l))),
            max: D(Math.max(...all.map((b) => b.h))),
            avg: D(all.reduce((s, b) => s + b.sum, 0) / pts),
            changePercent: (((c - o) / o) * 100)
              .toFixed(4)
              .replace(/\.?0+$/, '')
              .replace(/^-0$/, '0'),
            points: pts,
          },
        };
      }

      /** listPriceHistory: сырые точки раз в 5 мин, от новых к старым, курсор. */
      function historyPage(coin, offset, limit) {
        const r = CPT.rng(coin.id * 7 + offset),
          items = [];
        let v = Number(coin.price);
        const total = state.scen === 'few' ? 70 : 1000;
        for (let i = offset; i < Math.min(offset + limit, total); i++) {
          const fetchedAt = NOW - (state.scen === 'stale' ? 17 * MIN : 2.5 * MIN) - i * 5 * MIN;
          items.push({
            price: i === 0 ? coin.price : CPT.toDecimal(v, 10),
            sourceUpdatedAt: CPT.iso(fetchedAt - 41_000),
            fetchedAt: CPT.iso(fetchedAt),
          });
          v = v * (1 + (r() - 0.5) * coin.vol * 0.3);
        }
        return { items, nextCursor: offset + limit < total ? 'b2Zmc2V0' : null };
      }

      /** Комбинации > 1000 бакетов (ADR 0007) или < 2 бакетов — неактивны, с объяснением. */
      function comboIssue(interval, period) {
        const n = PERIODS[period] / INTERVALS[interval];
        if (n > 1000)
          return `${LABEL_I[interval]} × ${LABEL_P[period]} — это ${Math.round(n).toLocaleString('ru-RU')} бакетов, больше лимита 1000 (ADR 0007). Выберите интервал 1 д или 1 нед.`;
        if (n < 2)
          return `${LABEL_I[interval]} × ${LABEL_P[period]} — меньше двух бакетов, график не построить. Выберите интервал мельче.`;
        return null;
      }

      let coin, hours, agg, hist;
      function load() {
        coin = { ...COINS[state.id] };
        hours = hourly(coin, state.scen);
        agg = aggregates(hours, state.interval, state.period);
        hist = historyPage(coin, 0, state.histShown);
      }

      function segHTML(name, opts, current, disabledFn) {
        return `<div class="seg" role="group" aria-label="${name}">${opts
          .map(([v, t]) => {
            const issue = disabledFn?.(v);
            return `<button type="button" data-${name === 'Вид графика' ? 'kind' : name === 'Интервал' ? 'interval' : 'period'}="${v}" aria-pressed="${v === current}" ${issue ? `aria-disabled="true" title="${issue}"` : ''}>${t}</button>`;
          })
          .join('')}</div>`;
      }

      function render() {
        const page = document.getElementById('page');
        if (state.scen === 'notfound') {
          page.innerHTML = `<div class="card card-pad" style="text-align:center;padding:48px 16px" role="alert">
      ${CPT.icon('coins', { cls: 'nf-ico' })}<h1 style="margin:8px 0">Монета не отслеживается</h1>
      <p class="muted">Возможно, оператор удалил её из watchlist вместе с историей цен.</p>
      <p style="margin-top:14px"><a class="btn" href="dashboard.html">← К дашборду</a></p></div>`;
          return;
        }
        const latest = {
          price: coin.price,
          change24hPercent: coin.chg,
          isStale: state.scen === 'stale',
          fetchedAt: CPT.iso(NOW - (state.scen === 'stale' ? 17 : 2.5) * MIN),
          sourceUpdatedAt: CPT.iso(NOW - (state.scen === 'stale' ? 17 : 2.5) * MIN - 41_000),
        };
        const issueNow = comboIssue(state.interval, state.period);
        page.innerHTML = `
  <nav aria-label="Навигация"><a class="back" href="dashboard.html">${CPT.icon('arrow-left')}Дашборд</a></nav>
  <div class="coin-head">
    <div class="coin-title">${CPT.coinIcon(coin, 40)}
      <div><h1>${coin.symbol} <span class="muted" style="font-weight:500">· ${coin.name}</span></h1>
      <span class="hint">CMC #${coin.cmcId} · отслеживается с ${new Date(coin.createdAt).toLocaleDateString('ru-RU')}</span></div></div>
    <div class="stack" style="gap:2px">
      <div class="row" style="gap:12px"><span class="big-price" id="big-price">${CPT.priceHTML(latest.price, { stale: latest.isStale, sym: coin.symbol, src: latest.sourceUpdatedAt, fetched: latest.fetchedAt })}</span>${CPT.changeHTML(latest.change24hPercent, { suffix: ' <span class="muted" style="font-weight:400">за 24 ч</span>' })}</div>
      <span class="hint" id="fresh">${latest.isStale ? `<span class="stale-tag">${CPT.icon('triangle-alert')}устарела</span> · ` : ''}Обновлено ${CPT.timeHTML(latest.fetchedAt)} · котировка CMC ${CPT.timeHTML(latest.sourceUpdatedAt, 'hms')}</span>
    </div>
  </div>
  ${latest.isStale ? `<div class="banner banner-warn" role="status"><span class="b-icon">${CPT.icon('triangle-alert')}</span><div class="b-body"><strong>Цена устарела</strong><span>CoinMarketCap недоступен, последнее обновление — ${CPT.fmt.hm(latest.fetchedAt)}. График и история показывают сохранённые данные.</span></div></div>` : ''}
  ${state.scen === 'few' ? `<div class="banner banner-info" role="status"><span class="b-icon">${CPT.icon('info')}</span><div class="b-body"><strong>Данных пока мало</strong><span>История копится с момента добавления монеты: CMC Basic не отдаёт прошлые цены. Сейчас — ${agg.summary?.points ?? 0} точек за последние 6 ч.</span></div></div>` : ''}

  <section class="card" aria-labelledby="chart-title">
    <div class="card-head" style="gap:10px 18px">
      <h2 id="chart-title" class="sr-only">График цены</h2>
      <div class="controls">
        <div class="ctl"><span class="hint" aria-hidden="true">Вид</span>${segHTML(
          'Вид графика',
          [
            ['candles', 'Свечи'],
            ['line', 'Линия'],
          ],
          state.kind,
        )}</div>
        <div class="ctl"><span class="hint" aria-hidden="true">Интервал</span>${segHTML(
          'Интервал',
          [
            ['1h', '1ч'],
            ['4h', '4ч'],
            ['1d', '1д'],
            ['1w', '1н'],
          ],
          state.interval,
          (v) => comboIssue(v, state.period),
        )}</div>
        <div class="ctl"><span class="hint" aria-hidden="true">Период</span>${segHTML(
          'Период',
          [
            ['24h', '24ч'],
            ['7d', '7д'],
            ['30d', '30д'],
            ['1y', '1г'],
          ],
          state.period,
          (v) => comboIssue(state.interval, v),
        )}</div>
      </div>
    </div>
    <p class="combo-hint muted" id="combo-hint" role="status" style="padding:8px 16px 0;${issueNow ? '' : 'display:none'}">${issueNow ?? ''}</p>
    <div class="chart-wrap">
      <div class="legend" id="legend" aria-live="polite"></div>
      <div class="chart-box" id="chart" tabindex="0" role="group" aria-roledescription="график"
        aria-label="${coin.symbol}: ${state.kind === 'candles' ? 'свечи' : 'линия'}, интервал ${LABEL_I[state.interval]}, период ${LABEL_P[state.period]}. Стрелки влево и вправо — перемещение по бакетам." aria-describedby="legend"></div>
      <a class="tv-attr" href="https://www.tradingview.com/" rel="noopener" title="Charting by TradingView (attributionLogo)">TV</a>
    </div>
    <p class="hint" style="padding:0 16px 12px">Пустые промежутки — часы без данных (CMC был недоступен). Бакеты не интерполируются. В apps/web график рисует Lightweight Charts, здесь — SVG-имитация.</p>
  </section>

  <section aria-labelledby="sum-title" class="stack" style="gap:8px">
    <div class="row"><h2 id="sum-title">Сводка за ${LABEL_P[state.period]}</h2><span class="hint">getPriceAggregates.summary</span></div>
    ${
      agg.summary
        ? `<div class="stats">
      ${stat('Открытие', CPT.priceHTML(agg.summary.open, { sym: coin.symbol }))}
      ${stat('Закрытие', CPT.priceHTML(agg.summary.close, { sym: coin.symbol }))}
      ${stat('Минимум', CPT.priceHTML(agg.summary.min, { sym: coin.symbol }))}
      ${stat('Максимум', CPT.priceHTML(agg.summary.max, { sym: coin.symbol }))}
      ${stat(`Среднее <span title="Статистика: 10 значащих цифр (ADR 0007)">${CPT.icon('info')}<span class="sr-only">статистика, 10 значащих цифр</span></span>`, CPT.priceHTML(agg.summary.avg, { sym: coin.symbol }))}
      ${stat('Изменение', CPT.changeHTML(agg.summary.changePercent))}
      ${stat('Точек', `<span class="num">${agg.summary.points.toLocaleString('ru-RU')}</span>`)}
    </div>`
        : `<p class="muted">За период данных нет.</p>`
    }
  </section>

  <section class="card" aria-labelledby="hist-title">
    <div class="card-head"><h2 id="hist-title">История цен</h2><span class="hint">сырые точки, от новых к старым</span></div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th scope="col">Получено</th><th scope="col" class="r">Цена, USD</th><th scope="col" class="r hide-sm">Котировка CMC</th></tr></thead>
      <tbody>${hist.items.map((p) => `<tr><td class="num">${CPT.timeHTML(p.fetchedAt, 'dts')}</td><td class="r">${CPT.priceHTML(p.price, { sym: coin.symbol, src: p.sourceUpdatedAt, fetched: p.fetchedAt })}</td><td class="r num hide-sm">${CPT.timeHTML(p.sourceUpdatedAt, 'hms')}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="row" style="padding:12px 16px">${hist.nextCursor ? `<button class="btn" id="more">Загрузить ещё</button><span class="hint">nextCursor → следующая страница</span>` : `<span class="hint">Это все точки</span>`}</div>
  </section>`;
        bind();
        drawChart();
      }
      function stat(k, v) {
        return `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`;
      }

      function bind() {
        const hint = document.getElementById('combo-hint');
        document.querySelectorAll('[data-kind],[data-interval],[data-period]').forEach((b) =>
          b.addEventListener('click', () => {
            if (b.getAttribute('aria-disabled') === 'true') {
              hint.style.display = '';
              hint.textContent = b.title;
              return;
            }
            if (b.dataset.kind) state.kind = b.dataset.kind;
            if (b.dataset.interval) state.interval = b.dataset.interval;
            if (b.dataset.period) state.period = b.dataset.period;
            state.sel = null;
            load();
            render();
            document
              .querySelector(
                `[data-${b.dataset.kind ? 'kind' : b.dataset.interval ? 'interval' : 'period'}="${b.dataset.kind || b.dataset.interval || b.dataset.period}"]`,
              )
              ?.focus();
          }),
        );
        document.getElementById('more')?.addEventListener('click', () => {
          state.histShown += 10;
          hist = historyPage(coin, 0, state.histShown);
          render();
          document.getElementById('more')?.focus();
        });
        const box = document.getElementById('chart');
        box.addEventListener('keydown', (e) => {
          const n = agg.buckets.length;
          if (!n) return;
          if (e.key === 'ArrowLeft') state.sel = Math.max(0, (state.sel ?? n) - 1);
          else if (e.key === 'ArrowRight') state.sel = Math.min(n - 1, (state.sel ?? n - 2) + 1);
          else if (e.key === 'Home') state.sel = 0;
          else if (e.key === 'End') state.sel = n - 1;
          else return;
          e.preventDefault();
          drawChart();
        });
        box.addEventListener('mousemove', (e) => {
          const r = box.getBoundingClientRect();
          const x = e.clientX - r.left;
          let best = 0,
            dist = Infinity;
          geom.xs.forEach((bx, i) => {
            const d = Math.abs(bx - x);
            if (d < dist) {
              dist = d;
              best = i;
            }
          });
          if (state.sel !== best) {
            state.sel = best;
            drawChart();
          }
        });
        box.addEventListener('mouseleave', () => {
          state.sel = null;
          drawChart();
        });
      }

      let geom = { xs: [] };
      const tickTime = (t) =>
        state.period === '24h' || (state.period === '7d' && state.interval !== '1d')
          ? state.period === '24h'
            ? CPT.fmt.hm(CPT.iso(t))
            : new Date(t).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })
          : new Date(t).toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' });

      function drawChart() {
        const box = document.getElementById('chart');
        if (!box) return;
        const W = box.clientWidth,
          H = box.clientHeight,
          padR = 78,
          padB = 26,
          padT = 8,
          padL = 8;
        const b = agg.buckets,
          legend = document.getElementById('legend');
        if (!b.length) {
          box.innerHTML = `<div style="display:grid;place-items:center;height:100%" class="muted">За период данных нет</div>`;
          legend.innerHTML = '';
          return;
        }
        const size = INTERVALS[state.interval],
          from = Date.parse(agg.from),
          to = NOW;
        const lo = Math.min(...b.map((x) => Number(x.stats.min))),
          hi = Math.max(...b.map((x) => Number(x.stats.max)));
        const span = hi - lo || hi * 0.01,
          yMin = lo - span * 0.06,
          yMax = hi + span * 0.06;
        const X = (t) => padL + ((t - from) / (to - from)) * (W - padL - padR);
        const Y = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);
        const slot = Math.max(1, ((W - padL - padR) * size) / (to - from));
        const cw = Math.max(1, Math.min(14, slot * 0.68));
        geom.xs = b.map((x) => X(Date.parse(x.bucketStart) + size / 2));
        let svg = '';
        for (let i = 0; i <= 4; i++) {
          // сетка и правая шкала (как price scale в TradingView)
          const v = yMin + (yMax - yMin) * (i / 4),
            y = Y(v);
          svg += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${W - padR + 8}" y="${y + 4}" font-size="11" fill="var(--muted-foreground)" style="font-variant-numeric:tabular-nums">${CPT.axisLabel(v)}</text>`;
        }
        for (let i = 0; i <= 4; i++) {
          const t = from + (to - from) * (i / 4),
            x = X(t);
          svg += `<text x="${x}" y="${H - 8}" font-size="11" fill="var(--muted-foreground)" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${tickTime(t)}</text>`;
        }
        if (state.kind === 'candles') {
          b.forEach((x, i) => {
            const s = x.stats,
              o = Number(s.open),
              c = Number(s.close),
              up = c >= o,
              col = up ? 'var(--up)' : 'var(--down)',
              cx = geom.xs[i];
            const y1 = Y(Math.max(o, c)),
              y2 = Y(Math.min(o, c));
            svg +=
              `<line x1="${cx}" x2="${cx}" y1="${Y(Number(s.max))}" y2="${Y(Number(s.min))}" stroke="${col}" stroke-width="1"/>` +
              `<rect x="${cx - cw / 2}" y="${y1}" width="${cw}" height="${Math.max(1, y2 - y1)}" fill="${col}"/>`;
          });
        } else {
          let d = '';
          b.forEach((x, i) => {
            const gap = i > 0 && Date.parse(x.bucketStart) - Date.parse(b[i - 1].bucketStart) > size;
            d += `${i === 0 || gap ? 'M' : 'L'}${geom.xs[i].toFixed(1)},${Y(Number(x.stats.close)).toFixed(1)}`;
          });
          svg += `<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>`;
        }
        const last = b.at(-1),
          ly = Y(Number(last.stats.close));
        svg +=
          `<line x1="${padL}" x2="${W - padR}" y1="${ly}" y2="${ly}" stroke="var(--muted-foreground)" stroke-dasharray="3 3" opacity=".6"/>` +
          `<rect x="${W - padR + 2}" y="${ly - 10}" width="${padR - 4}" height="20" rx="4" fill="var(--foreground)"/><text x="${W - padR + 8}" y="${ly + 4}" font-size="11" font-weight="700" fill="var(--background)" style="font-variant-numeric:tabular-nums">${CPT.axisLabel(Number(last.stats.close))}</text>`;
        const sel = state.sel ?? b.length - 1;
        if (state.sel !== null)
          svg += `<line x1="${geom.xs[sel]}" x2="${geom.xs[sel]}" y1="${padT}" y2="${H - padB}" stroke="var(--muted-foreground)" stroke-dasharray="4 3"/>`;
        box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${svg}</svg>`;
        const s = b[sel].stats,
          st = b[sel].bucketStart;
        // Дневные и недельные бакеты выровнены по UTC (ADR 0007): показываем дату UTC, а не «03:00» по Москве
        const when = ['1d', '1w'].includes(state.interval)
          ? `<time datetime="${st}" title="${st} (UTC)">${state.interval === '1w' ? 'нед. с ' : ''}${new Date(st).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' })} UTC</time>`
          : CPT.timeHTML(st, 'dt');
        legend.innerHTML = `<span class="num">${when}</span>
    <span><b>O</b>${CPT.priceHTML(s.open, { lens: false })}</span><span><b>H</b>${CPT.priceHTML(s.max, { lens: false })}</span><span><b>L</b>${CPT.priceHTML(s.min, { lens: false })}</span><span><b>C</b>${CPT.priceHTML(s.close, { lens: false })}</span>
    ${CPT.changeHTML(s.changePercent)}<span class="muted">${s.points} точ.</span>`;
      }

      new ResizeObserver(() => drawChart()).observe(document.body);
      document.addEventListener('cpt:theme', () => drawChart());

      /* price.updated → обновить последнюю свечу (в apps/web — series.update()) и цену в шапке */
      document.getElementById('sim').addEventListener('click', () => {
        if (state.scen !== 'normal') {
          CPT.toast('Событие доступно в сценарии «Норма»', 'info');
          return;
        }
        const k = 1 + (Math.random() - 0.45) * 0.004,
          v = Number(coin.price) * k;
        coin.price = CPT.toDecimal(v, 10);
        const lastH = hours.at(-1);
        lastH.c = v;
        lastH.h = Math.max(lastH.h, v);
        lastH.l = Math.min(lastH.l, v);
        agg = aggregates(hours, state.interval, state.period);
        const el = document.getElementById('big-price');
        el.innerHTML = CPT.priceHTML(coin.price, {
          sym: coin.symbol,
          src: CPT.iso(CPT.NOW - 41_000),
          fetched: CPT.iso(CPT.NOW),
        });
        CPT.flash(el, k >= 1 ? 'up' : 'down');
        drawChart();
      });

      document.getElementById('coin').value = String(state.id);
      document.getElementById('scenario').value = state.scen;
      document.getElementById('coin').addEventListener('change', (e) => {
        state.id = Number(e.target.value);
        state.histShown = 10;
        load();
        render();
      });
      document.getElementById('scenario').addEventListener('change', (e) => {
        state.scen = e.target.value;
        state.histShown = 10;
        load();
        render();
      });
      CPT.mountChrome({ active: 'dashboard', role: 'operator' });

      /* ---------- Гид по карточке монеты: 7 шагов, одинаково для обеих ролей ---------- */
      CPT_TOUR.register('coin', () => [
        {
          el: '.coin-head',
          icon: 'coins',
          title: 'Карточка монеты',
          body: '<p>Символ, название, номер в CoinMarketCap и текущая цена с изменением за сутки. Цену можно нажать — линза покажет все знаки.</p>',
          api: '<code>getCryptocurrency</code> → <code>latestPrice</code>',
        },
        {
          el: '#fresh',
          icon: 'clock',
          title: 'Два времени у одной цены',
          body: '<p>«Котировка CMC» — когда цену посчитал CoinMarketCap. «Обновлено» — когда её получил наш сервис. Разница обычно меньше минуты.</p>',
          api: '<code>sourceUpdatedAt</code>, <code>fetchedAt</code>',
        },
        {
          el: '.controls',
          icon: 'chart-candlestick',
          title: 'Вид, интервал и период',
          body: '<p>Свечи или линия, интервал свечи от часа до недели и период до года. Слишком подробные сочетания неактивны: например, «1 ч × 1 год» — это 8 760 свечей при лимите 1 000.</p>',
          api: '<code>getPriceAggregates?interval&from</code> (ADR 0007)',
        },
        {
          el: '#chart',
          icon: 'chart-spline',
          title: 'График',
          body: '<p>Наведите курсор или поставьте фокус на график и листайте стрелками <kbd>←</kbd> <kbd>→</kbd> — сверху появятся открытие, максимум, минимум и закрытие. Пропуски — часы без данных: мы их не дорисовываем.</p>',
          api: '<code>buckets[].stats</code>: open, max, min, close, points',
        },
        {
          el: '.tv-attr',
          icon: 'book-open',
          title: 'Атрибуция TradingView',
          body: '<p>График рисует библиотека TradingView Lightweight Charts. Её лицензия требует указать автора — поэтому значок на графике и ссылка в футере.</p>',
        },
        {
          el: '.stats',
          icon: 'gauge',
          title: 'Сводка за период',
          body: '<p>Открытие, закрытие, минимум и максимум — реальные наблюдённые цены. Среднее — статистика, округлена до 10 значащих цифр.</p>',
          api: '<code>getPriceAggregates</code> → <code>summary</code>',
        },
        {
          el: '#hist-title',
          icon: 'list',
          title: 'История цен',
          body: '<p>Все сохранённые точки — от новых к старым. «Загрузить ещё» подгружает следующую страницу.</p>',
          api: '<code>listPriceHistory?limit&cursor</code> → <code>nextCursor</code>',
        },
      ]);
      load();
      render();
      CPT_TOUR.autoStart();
    </script>
  </body>
</html>
